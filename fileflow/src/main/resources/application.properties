spring.application.name=fileflow
spring.datasource.url=jdbc:h2:mem:fileflow
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Phase 2: SFTP + retries
fileflow.sftp.password=${FILEFLOW_SFTP_PASSWORD:}
fileflow.sftp.known-hosts=
fileflow.transfer.max-attempts=3
fileflow.transfer.initial-delay-ms=2000