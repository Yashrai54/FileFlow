name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fileflow        # <- your project folder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fileflow/pom.xml   # <- same folder

      - name: Build and test
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -t fileflow:ci .